<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Khách sạn Galaxy - Chọn địa chỉ</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #f4f6f9; 
            margin: 0; 
            padding: 20px; 
            text-align: center; 
        }
        .container { 
            max-width: 450px; 
            margin: 40px auto; 
            background: white; 
            padding: 30px 20px; 
            border-radius: 16px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
        }
        h2 { 
            color: #1a73e8; 
            margin-bottom: 8px; 
            font-size: 22px; 
        }
        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn { 
            display: block; 
            background: #1a73e8; 
            color: white; 
            padding: 16px; 
            margin: 14px 0; 
            border-radius: 10px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 16px; 
            transition: background 0.2s, transform 0.1s; 
            box-shadow: 0 2px 5px rgba(26,115,232,0.3);
        }
        .btn:hover { 
            background: #1557b0; 
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Hệ Thống Khách Sạn Galaxy</h2>
        <p class="subtitle">Vui lòng chọn cơ sở bạn muốn đến để mở bản đồ</p>
        
        <!-- Galaxy I -->
        <a class="btn" href="https://maps.app.goo.gl/oCK63iC5GmMZH1Zy9" target="_blank">🏨 Galaxy I Hotel</a>
        
        <!-- Galaxy II -->
        <a class="btn" href="https://maps.app.goo.gl/1wnqUv7LYEpphmpL7" target="_blank">🏨 Galaxy II Hotel</a>
        
        <!-- Galaxy III -->
        <a class="btn" href="https://maps.app.goo.gl/WiSZGQRrUT6rUGA97" target="_blank">🏨 Galaxy III Hotel</a>
        
        <!-- Galaxy IV -->
        <a class="btn" href="https://maps.app.goo.gl/afMhQhttUVZMDPb99" target="_blank">🏨 Galaxy IV Hotel</a>
    </div>
</body>
</html>
